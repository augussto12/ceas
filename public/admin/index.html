<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrador CEAS</title>
</head>

<body>
    <script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
        if (typeof window.CMS === 'undefined') {
            console.error("Decap CMS no se cargó correctamente.");
        } else {
            window.CMS.init();
        }

        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>

    <!-- Silenciar errores visuales -->
    <script>
        window.addEventListener('error', function (event) {
            if (event.filename && event.filename.includes('decap-cms')) {
                event.stopImmediatePropagation();
                event.preventDefault();
                return false;
            }
        });

        window.addEventListener('unhandledrejection', function (event) {
            if (event.reason && event.reason.stack && event.reason.stack.includes('decap-cms')) {
                event.preventDefault();
                return false;
            }
        });
    </script>
</body>

</html>
