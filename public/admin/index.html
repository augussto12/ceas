<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrador CEAS</title>
  </head>
  <body>
    <!-- Usamos jsDelivr que sirve el MIME correcto -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.0.13/dist/decap-cms.min.js"></script>
    
    <!-- Inicializar CMS -->
    <script>
      if (typeof window.CMS === 'undefined') {
        console.error("Decap CMS no se cargó correctamente.");
      } else {
        window.CMS.init();
      }
    </script>
  </body>
</html>
